# Generic tmux config (public tier). Standalone — personal/machine tweaks layer in via
# ~/.tmux.conf.local at the end (supplied by a private tier, if any).

# ESC must not be treated as the start of an escape sequence for long — vim and other TUIs feel
# laggy above ~50ms.
set -s escape-time 10

set -g mouse on

# Let OSC 52 clipboard escapes through to the terminal you're physically sitting at. tmux defaults
# this to `external`, which silently drops an application's OSC 52. Needs tmux >= 2.6.
set -g set-clipboard on
set-window-option -g xterm-keys on

# Truecolor. tmux-256color is tmux's own terminfo entry; fall back to screen-256color where the
# system lacks it (some minimal installs do) so tmux still starts rather than refusing.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
# Tell tmux the outer terminal is RGB-capable, else it down-samples 24-bit color on the way out.
# Leading comma is the documented `set -a` idiom, not a typo.
set -as terminal-features ',*256col*:RGB'

set -g history-limit 50000
set-option -g status-keys emacs
setw -g mode-keys vi

# 1-based window/pane numbering, renumber on close.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Quick config reload.
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# New window / splits inherit the current path.
# Splits are letters, named for the DIVIDER you get: v = a vertical line (panes side by side),
# h = a horizontal line (panes stacked). Letters sit in the same place on every layout — `\` and
# `|` are chords on a German keyboard. `-` and `\` stay as aliases for muscle memory.
bind c new-window -c '#{pane_current_path}'
bind v split-window -h -c '#{pane_current_path}'
bind h split-window -v -c '#{pane_current_path}'
bind '\' split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind b break-pane -d

# Copy mode (vi).
unbind-key -T copy-mode-vi v
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi 'C-v' send-keys -X rectangle-toggle

# Copy to the system clipboard — pick the tool the OS provides (macOS pbcopy, else Wayland wl-copy).
# A no-op at copy time if neither is installed; doesn't affect tmux startup.
if-shell "uname | grep -q Darwin" {
  bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
  bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
} {
  bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
  bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
}

# C-b C-b is the nested-tmux TOGGLE (see "Nested tmux" below), not tmux's default one-shot send-prefix.

# Move panes between windows.
bind-key j command-prompt -p "join pane from:" "join-pane -s '%%'"
bind-key k command-prompt -p "send pane to:" "join-pane -t '%%'"

# --- Per-host status-bar color ---------------------------------------------------------------
# host_color.sh hashes the hostname to a stable color so each machine's tmux looks distinct at a
# glance. Shipped with this package at ~/.tmux/host_color.sh — self-contained, no external script.
# @wcolor (if a local overlay sets it per-window) wins; otherwise fall back to the host color.
run-shell 'C=$(sh "$HOME/.tmux/host_color.sh"); tmux set -g @hostcolor "$C"; \
  tmux set -g status-style "bg=$C,fg=colour15,bold"'
set -g window-status-format         "#[bg=#{?@wcolor,#{@wcolor},#{@hostcolor}},fg=colour15] #I:#W#F "
set -g window-status-current-format "#[bg=colour15,fg=#{?@wcolor,#{@wcolor},#{@hostcolor}},bold] #I:#W#F "

# Left: short hostname.  Right: date/time then session name. Below 100 columns (a handheld
# console, a phone SSH session) both shrink so the window list keeps the room: the hostname
# to its first 3 letters + `+` when cut (cyberdeck -> cyb+), the right side to just the time.
# The hostname sits in its own dark block (not the host colour) so it reads at a glance; the
# C-b C-b toggle below swaps it to a light block when this tmux is OFF. The window list that follows
# paints its own colours, so the block's edge is the separator.
# While the prefix is armed (C-b pressed, waiting for the next key) the block turns yellow, so
# with nested tmux you can see WHICH one just took your C-b.
set -g status-left "#{?client_prefix,#[bg=colour220]#[fg=colour16],} #{?#{e|<:#{client_width},100},#{=/3/+:host_short},#{host_short}} "
set -g status-left-style "bg=colour236,fg=colour15,bold"
set -g status-left-length 14
# An explicit OFF tag while this tmux is toggled off (C-b C-b) — the grey bar alone is easy to miss on
# a small screen.
set -g status-right "#{?#{==:#{client_key_table},off},#[reverse] OFF #[noreverse] ,}#{?#{e|<:#{client_width},100}, %H:%M, %Y-%m-%d %H:%M│#S}"
set -g status-right-style "bold"

# --- Nested tmux: C-b C-b hands the keyboard to the inner (remote) tmux, and back ------------------
# Local tmux -> ssh -> remote tmux: both answer to C-b, so the outer one always wins. Natively C-b C-b
# sends ONE prefix through; here it's a toggle (Jake, 2026-10-27): hold Ctrl, tap b twice.
#   ON -> OFF: C-b C-b. This tmux goes quiet (no prefix, no bindings); its status bar greys out, moves to
#              the top and shows OFF, so you can see which tmux is live.
#   while OFF: C-b goes straight to the inner tmux (C-b c, C-b n … drive the remote).
#   OFF -> ON: C-b C-b again, the two taps within 400 ms. ~/.tmux/nested-cb.sh does the timing: tmux
#              itself drops any key that follows a custom key table, so "watch for a second C-b but pass
#              everything else through" can't be done with key tables alone (tested). Slower taps are
#              simply two C-b's for the inner tmux.
# Replaces the old C-a toggle: C-a is the shell's beginning-of-line again.
# Session-level `set` (not -g) so `set -u` falls back to the global host colour on the way back.
bind C-b \
  set prefix None \;\
  set key-table off \;\
  set -u @nested_cb_last \;\
  set status-position top \;\
  set status-style "fg=colour245,bg=colour238" \;\
  set window-status-current-style "fg=colour238,bg=colour245" \;\
  set status-left-style "bg=colour250,fg=colour236,bold" \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S
bind -T off C-b run-shell "sh ~/.tmux/nested-cb.sh '#{session_id}' '#{pane_id}' '#{client_name}'"

# Local overlay — personal/machine-specific tmux config, kept out of this public file. The -q means
# quiet-if-absent, so a machine with only the public tier is a clean no-op.
source-file -q ~/.tmux.conf.local
